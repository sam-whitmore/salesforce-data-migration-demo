name: customer_preparation
version: '1.0.0'
config-version: 2
profile: customer_preparation

model-paths: [models]

flags:
  send_anonymous_usage_stats: false

models:
  customer_preparation:
    stage_customers:
      +materialized: table
      +file_format: delta
      +alias: "{{ var('customers_snapshot_table_name') }}"
    stage_products:
      +materialized: table
      +file_format: delta
      +alias: "{{ var('products_snapshot_table_name') }}"
    stage_licences:
      +materialized: table
      +file_format: delta
      +alias: "{{ var('licences_snapshot_table_name') }}"
