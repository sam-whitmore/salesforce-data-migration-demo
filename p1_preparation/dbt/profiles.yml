customer_preparation:
  target: dev
  outputs:
    dev:
      type: databricks # dbt's Databricks adapter
      host: "{{ env_var('DATABRICKS_SERVER_HOSTNAME') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN') }}"
      catalog: workspace
      schema: migration
      threads: 1
