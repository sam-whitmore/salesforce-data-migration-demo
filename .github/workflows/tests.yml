name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check dbt project configuration
        env:
          DATABRICKS_SERVER_HOSTNAME: example.invalid
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/example
          DBT_ENV_SECRET_DATABRICKS_TOKEN: unused
        run: >-
          dbt parse --project-dir p1_preparation/dbt --profiles-dir p1_preparation/dbt
          --no-partial-parse --vars '{"customers_snapshot_table_name": "customers_snapshot_ci"}'
